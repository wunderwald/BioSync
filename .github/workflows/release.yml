# Builds BioSync for macOS (Apple silicon), Windows and Linux, and publishes a GitHub release.
#
#   git tag v2.0.0-beta.1 && git push origin v2.0.0-beta.1
#
# A tag with a hyphen (v2.0.0-beta.1, v2.0.0-rc.1) becomes a pre-release, one without (v2.0.0) a normal release.
# "Run workflow" on the Actions tab builds without publishing: the downloads are attached to the run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # to create the release

env:
  PYTHON_VERSION: '3.11.9'

jobs:
  test:
    name: Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python from python.org
        # Its Tk (8.6.13) takes clicks reliably on macOS; see app/README.md
        run: |
          curl -fsSL -o python.pkg "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: python3.11 -m pip install -r app/requirements-dev.txt
      - name: Run tests
        run: python3.11 -m pytest

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retires runner images every year or two (macos-14 in November 2026), and a run then fails with
          # "The configuration ... is not supported". Pinned images keep builds the same until then.
          - name: macOS-AppleSilicon
            os: macos-15
            python: python3.11
          - name: Windows-x64
            os: windows-2022
            python: python
          - name: Linux-x64
            # an older Linux, so that the build runs on more distributions. Deprecated; retired around April 2027,
            # then use ubuntu-24.04
            os: ubuntu-22.04
            python: python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Python from python.org (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o python.pkg "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"
      - name: Install Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Tcl/Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tk8.6

      - name: Check Tk
        # build.py only warns about a Tk that ignores clicks on macOS; a release must not have it
        run: |
          ${{ matrix.python }} - <<'EOF'
          import sys, tkinter
          sys.path.insert(0, "app")
          from build import is_affected_tk
          version = tkinter.Tcl().eval("info patchlevel")
          print("Tk", version)
          sys.exit(f"Tk {version} ignores clicks on macOS" if is_affected_tk(sys.platform, version) else 0)
          EOF

      - name: Install dependencies
        run: ${{ matrix.python }} -m pip install -r app/requirements-build.txt
      - name: Build
        run: ${{ matrix.python }} app/build.py

      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="dev-${GITHUB_SHA::7}"
          name="BioSync-${version}-${{ matrix.name }}"
          mkdir -p packages
          cd app/dist
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent BioSync.app "../../packages/${name}.zip" ;;   # keeps the app's links
            Windows) 7z a -tzip "../../packages/${name}.zip" BioSync > /dev/null ;;
            Linux)   tar -czf "../../packages/${name}.tar.gz" BioSync ;;                    # keeps file permissions
          esac
          ls -l ../../packages

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: packages/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" packages/* --title "BioSync $GITHUB_REF_NAME" --generate-notes $prerelease
